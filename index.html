<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>琳蔓の🍳 - 美食转盘</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --primary: #667eea;
            --secondary: #764ba2;
            --accent: #f093fb;
            --glass: rgba(255, 255, 255, 0.12);
            --glass-strong: rgba(255, 255, 255, 0.18);
            --glass-border: rgba(255, 255, 255, 0.18);
            --text: #ffffff;
            --shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
            --r-sm: 14px;
            --r-md: 20px;
        }

        html, body {
            height: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0;
            position: relative;
            transition: background 1.5s ease-in-out;
            color: var(--text);
        }

        .floating-foods {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .food-particle {
            position: absolute;
            opacity: 0.2;
            animation: drift 25s infinite ease-in-out;
        }

        .food-particle.layer-far {
            filter: blur(1.5px);
            opacity: 0.12;
        }

        .food-particle.layer-mid {
            filter: blur(0.5px);
            opacity: 0.18;
        }

        .food-particle.layer-near {
            opacity: 0.28;
        }

        @keyframes drift {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            20% { transform: translate(15px, -30px) rotate(72deg); }
            40% { transform: translate(-10px, -50px) rotate(144deg); }
            60% { transform: translate(20px, -25px) rotate(216deg); }
            80% { transform: translate(-15px, -45px) rotate(288deg); }
        }

        .page {
            width: 100%;
            max-width: 500px;
            padding: 20px 16px 80px;
            position: relative;
            z-index: 1;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
            position: relative;
        }

        .header::before,
        .header::after {
            content: '🍜';
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 22px;
            opacity: 0.5;
        }

        .header::before { left: 0; }
        .header::after { right: 0; content: '🍳'; }

        h1 {
            font-size: 2.2em;
            font-weight: 800;
            color: var(--text);
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.3), 0 0 40px rgba(102, 126, 234, 0.5);
            letter-spacing: -0.02em;
        }

        .subtitle {
            font-size: 0.82em;
            color: rgba(255, 255, 255, 0.75);
            text-shadow: var(--shadow);
            margin-top: 4px;
        }

        .wheel-section {
            position: relative;
            width: 100%;
            max-width: 320px;
            margin: 0 auto 16px;
        }

        .wheel-container {
            position: relative;
            width: 100%;
            padding-bottom: 100%;
        }

        .wheel {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow:
                0 0 0 6px rgba(255, 255, 255, 0.8),
                0 0 0 9px rgba(102, 126, 234, 0.35),
                0 0 36px rgba(102, 126, 234, 0.4),
                inset 0 0 24px rgba(0, 0, 0, 0.12);
            transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99);
            overflow: hidden;
        }

        .wheel-segment {
            position: absolute;
            width: 50%;
            height: 50%;
            left: 50%;
            top: 0;
            transform-origin: 0% 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            clip-path: polygon(0% 100%, 100% 0%, 0% 0%);
        }

        .wheel-segment span {
            position: absolute;
            font-size: 12px;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
            white-space: nowrap;
        }

        .pointer {
            position: absolute;
            top: -6px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.4));
        }

        .pointer::before {
            content: '';
            display: block;
            width: 0;
            height: 0;
            border-left: 16px solid transparent;
            border-right: 16px solid transparent;
            border-top: 34px solid #ff6b6b;
        }

        .pointer::after {
            content: '';
            position: absolute;
            top: -34px;
            left: 50%;
            transform: translateX(-50%);
            width: 16px;
            height: 16px;
            background: #ff6b6b;
            border-radius: 50%;
        }

        .center-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            border-radius: 50%;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 14px;
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.5);
            cursor: pointer;
            border: none;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
        }

        .center-btn:active {
            transform: translate(-50%, -50%) scale(0.93);
        }

        .spin-btn {
            width: 100%;
            max-width: 300px;
            margin: 0 auto 16px;
            display: flex;
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
            color: white;
            border: none;
            padding: 15px 0;
            font-size: 1.1em;
            font-weight: 700;
            border-radius: var(--r-md);
            cursor: pointer;
            box-shadow: 0 6px 24px rgba(238, 90, 111, 0.4);
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.2);
            transition: all 0.2s;
        }

        .spin-btn:active:not(:disabled) {
            transform: scale(0.97);
        }

        .spin-btn:disabled {
            background: linear-gradient(135deg, rgba(160, 174, 192, 0.6), rgba(113, 128, 150, 0.6));
            box-shadow: none;
        }

        .result-card {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.8), rgba(118, 75, 162, 0.8));
            backdrop-filter: blur(12px);
            border-radius: var(--r-md);
            padding: 16px;
            color: white;
            font-size: 1.2em;
            font-weight: 700;
            min-height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.15);
            animation: breathe 2.5s ease-in-out infinite;
        }

        @keyframes breathe {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.015); }
        }

        .result-card.highlight {
            animation: pop 0.4s ease-in-out 3;
        }

        @keyframes pop {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.06); }
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 18px 0 14px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.15);
        }

        .panel {
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--r-md);
            border: 1px solid var(--glass-border);
            overflow: hidden;
            margin-bottom: 12px;
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
        }

        .panel-header-left {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 0.95em;
            text-shadow: var(--shadow);
        }

        .panel-arrow {
            font-size: 12px;
            transition: transform 0.3s;
            opacity: 0.6;
        }

        .panel.open .panel-arrow {
            transform: rotate(180deg);
        }

        .panel-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.35s ease;
        }

        .panel.open .panel-body {
            max-height: 600px;
        }

        .panel-content {
            padding: 0 16px 16px;
        }

        .food-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .food-chip {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: rgba(255, 255, 255, 0.18);
            padding: 7px 12px;
            border-radius: 16px;
            font-size: 0.85em;
            color: var(--text);
            border: 1px solid rgba(255, 255, 255, 0.15);
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.2);
            transition: background 0.2s;
        }

        .food-chip:active {
            background: rgba(255, 255, 255, 0.28);
        }

        .del-btn {
            background: rgba(255, 107, 107, 0.8);
            color: white;
            border: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 13px;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        .del-btn:active { transform: scale(1.15); }

        .input-row {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }

        .food-input {
            flex: 1;
            padding: 11px 14px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: var(--r-md);
            font-size: 0.9em;
            background: rgba(255, 255, 255, 0.12);
            color: var(--text);
        }

        .food-input::placeholder {
            color: rgba(255, 255, 255, 0.55);
        }

        .food-input:focus {
            outline: none;
            border-color: rgba(102, 126, 234, 0.5);
            background: rgba(255, 255, 255, 0.18);
        }

        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .act-btn {
            padding: 11px 0;
            border: none;
            border-radius: var(--r-md);
            cursor: pointer;
            font-size: 0.85em;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            color: white;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.2);
            transition: transform 0.15s;
        }

        .act-btn:active { transform: scale(0.96); }

        .act-add { background: linear-gradient(135deg, rgba(72, 187, 120, 0.8), rgba(56, 161, 105, 0.8)); }
        .act-reset { background: linear-gradient(135deg, rgba(237, 137, 54, 0.8), rgba(221, 107, 32, 0.8)); }
        .act-export { background: linear-gradient(135deg, rgba(66, 153, 225, 0.8), rgba(49, 130, 206, 0.8)); }
        .act-import { background: linear-gradient(135deg, rgba(159, 122, 234, 0.8), rgba(128, 93, 213, 0.8)); }

        .tip {
            text-align: center;
            font-size: 0.78em;
            color: rgba(255, 255, 255, 0.55);
            line-height: 1.6;
            padding: 12px 0;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.15);
        }

        .bg-tag {
            position: fixed;
            bottom: 16px;
            right: 12px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            padding: 6px 12px;
            border-radius: 14px;
            font-size: 0.75em;
            color: rgba(255, 255, 255, 0.7);
            z-index: 100;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .toast {
            position: fixed;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(30, 30, 50, 0.92);
            backdrop-filter: blur(12px);
            color: white;
            padding: 12px 22px;
            border-radius: var(--r-md);
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.3);
            z-index: 9999;
            animation: toastSlide 0.25s ease-out;
            font-weight: 600;
            font-size: 0.9em;
            max-width: 88%;
            text-align: center;
        }

        @keyframes toastSlide {
            from { opacity: 0; transform: translateX(-50%) translateY(-16px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        .hidden { display: none; }

        @media (max-width: 400px) {
            .page { padding: 16px 10px 70px; }
            h1 { font-size: 1.9em; }
            .wheel-section { max-width: 270px; }
            .wheel-segment span { font-size: 10px; }
            .center-btn { width: 56px; height: 56px; font-size: 12px; }
            .spin-btn { padding: 13px 0; font-size: 1em; }
            .result-card { font-size: 1.05em; padding: 14px; }
            .btn-grid { grid-template-columns: 1fr; }
        }

        @media (min-width: 768px) {
            .page { padding: 32px 24px 80px; }
            h1 { font-size: 2.8em; }
            .wheel-section { max-width: 360px; }
            .wheel-segment span { font-size: 14px; }
            .center-btn { width: 76px; height: 76px; font-size: 15px; }
        }
    </style>
</head>
<body>
    <div class="floating-foods" id="floatingFoods"></div>

    <div class="page">
        <div class="header">
            <h1>琳蔓の🍳</h1>
            <p class="subtitle">转一转，今天吃什么 ✨</p>
        </div>

        <div class="wheel-section">
            <div class="wheel-container">
                <div class="pointer"></div>
                <div class="wheel" id="wheel"></div>
                <button class="center-btn" onclick="spin()">开始</button>
            </div>
        </div>

        <button class="spin-btn" id="spinBtn" onclick="spin()">
            <span>🎲</span>
            <span>转动转盘</span>
        </button>

        <div class="result-card" id="result">👇 点击上方按钮开始</div>

        <div class="divider">🍜 食物列表 🍲</div>

        <div class="panel open" id="listPanel">
            <div class="panel-header" onclick="togglePanel('listPanel')">
                <div class="panel-header-left"><span>📋</span><span>我的菜单</span></div>
                <span class="panel-arrow">▼</span>
            </div>
            <div class="panel-body">
                <div class="panel-content">
                    <div class="food-chips" id="foodListDisplay"></div>
                </div>
            </div>
        </div>

        <div class="panel" id="editPanel">
            <div class="panel-header" onclick="togglePanel('editPanel')">
                <div class="panel-header-left"><span>✏️</span><span>管理菜单</span></div>
                <span class="panel-arrow">▼</span>
            </div>
            <div class="panel-body">
                <div class="panel-content">
                    <div class="input-row">
                        <input type="text" class="food-input" id="newFoodInput" placeholder="输入食物名称...">
                        <button class="act-btn act-add" onclick="addFood()">➕</button>
                    </div>
                    <div class="btn-grid">
                        <button class="act-btn act-reset" onclick="resetFoods()">🔄 重置</button>
                        <button class="act-btn act-export" onclick="exportConfig()">📤 导出</button>
                        <button class="act-btn act-import" onclick="document.getElementById('importInput').click()">📥 导入</button>
                    </div>
                    <input type="file" id="importInput" class="hidden" accept=".json" onchange="importConfig(event)">
                </div>
            </div>
        </div>

        <div class="tip">
            🍃 数据仅存于本浏览器 · 换设备会丢失<br>
            📤 导出配置可分享给朋友 · 建议定期备份
        </div>
    </div>

    <div class="bg-tag" id="bgTag">🎨 自动换肤</div>

    <script>
        const DEFAULT_FOODS = [
            '羊肉面🍜', '鸡公煲🍲', '汉堡🍔', '鸡排🍗',
            '寿司🍣', '卤面🍜', '串串🍢', '酸辣粉🌶️',
            '凉皮🥒', '粥🥣', '馄饨🥟', '外婆味道👵',
            '烤鱼🐟', '盖饭🍛', '胡辣汤🌶️', '火锅🍲',
            '麻辣烫🌶️', '披萨🍕', '炸鸡🍗', '拉面🍜',
            '饺子🥟', '炒饭🍛', '米线🍜', '烧烤🍢'
        ];

        const FOOD_WEIGHTS = { '羊肉面🍜': 2 };

        let foods = [];
        let isSpinning = false;
        let currentRotation = 0;
        let currentBgIndex = 0;
        let userId = '';

        const colors = [
            '#FF6B6B', '#4ECDC4', '#45B7D1', '#96CEB4',
            '#FFEAA7', '#DDA0DD', '#98D8C8', '#F7DC6F',
            '#BB8FCE', '#85C1E9', '#F8B500', '#00CED1',
            '#FF69B4', '#32CD32', '#FFD700', '#FF6347',
            '#9370DB', '#20B2AA', '#FF7F50', '#87CEEB',
            '#FFA07A', '#98FB98', '#DDA0DD', '#F0E68C'
        ];

        const backgrounds = [
            'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
            'linear-gradient(135deg, #f093fb 0%, #f5576c 100%)',
            'linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)',
            'linear-gradient(135deg, #43e97b 0%, #38f9d7 100%)',
            'linear-gradient(135deg, #fa709a 0%, #fee140 100%)',
            'linear-gradient(135deg, #a8edea 0%, #fed6e3 100%)',
            'linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%)',
            'linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%)',
            'linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%)',
            'linear-gradient(135deg, #d299c2 0%, #fef9d7 100%)',
            'linear-gradient(135deg, #89f7fe 0%, #66a6ff 100%)',
            'linear-gradient(135deg, #cd9cf2 0%, #f6f3ff 100%)',
            'linear-gradient(135deg, #fddb92 0%, #d1fdff 100%)',
            'linear-gradient(135deg, #9890e3 0%, #b1f4cf 100%)',
            'linear-gradient(135deg, #f6d365 0%, #fda085 100%)',
            'linear-gradient(135deg, #96fbc4 0%, #f9f586 100%)'
        ];

        const foodEmojis = [
            '🍳', '🍜', '🍲', '🍱', '🍣', '🍕', '🍔', '🌮',
            '🥗', '🍝', '🥘', '🥙', '🍛', '🥟', '🥡', '🥠',
            '🍗', '🍖', '🥩', '🌭', '🥪', '🥫', '🥣', '🥧',
            '🍰', '🎂', '🧁', '🍪', '☕', '🍵', '🥤', '🍺'
        ];

        function generateUserId() {
            let id = localStorage.getItem('wheel_user_id');
            if (!id) {
                id = 'u_' + Math.random().toString(36).substr(2, 8);
                localStorage.setItem('wheel_user_id', id);
            }
            return id;
        }

        function loadFoods() {
            const saved = localStorage.getItem(`wf_${userId}`);
            if (saved) {
                try { foods = JSON.parse(saved); } catch (e) { foods = [...DEFAULT_FOODS]; }
            } else {
                foods = [...DEFAULT_FOODS];
            }
        }

        function saveFoods() {
            localStorage.setItem(`wf_${userId}`, JSON.stringify(foods));
        }

        function showToast(msg, ms = 2500) {
            const old = document.querySelector('.toast');
            if (old) old.remove();
            const t = document.createElement('div');
            t.className = 'toast';
            t.textContent = msg;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), ms);
        }

        function togglePanel(id) {
            document.getElementById(id).classList.toggle('open');
        }

        function createFloatingFoods() {
            const c = document.getElementById('floatingFoods');
            c.innerHTML = '';
            const layers = ['layer-far', 'layer-mid', 'layer-near'];
            const sizes = [[20, 28], [28, 38], [36, 50]];
            const counts = [10, 12, 8];

            layers.forEach((layer, li) => {
                for (let i = 0; i < counts[li]; i++) {
                    const p = document.createElement('div');
                    p.className = `food-particle ${layer}`;
                    p.textContent = foodEmojis[Math.floor(Math.random() * foodEmojis.length)];
                    p.style.left = Math.random() * 100 + '%';
                    p.style.top = Math.random() * 100 + '%';
                    p.style.animationDelay = Math.random() * 25 + 's';
                    p.style.animationDuration = (20 + Math.random() * 15) + 's';
                    const [min, max] = sizes[li];
                    p.style.fontSize = (min + Math.random() * (max - min)) + 'px';
                    c.appendChild(p);
                }
            });
        }

        function changeBackground() {
            currentBgIndex = (currentBgIndex + 1) % backgrounds.length;
            document.body.style.background = backgrounds[currentBgIndex];
            const tag = document.getElementById('bgTag');
            tag.textContent = `🎨 ${currentBgIndex + 1}/${backgrounds.length}`;
            setTimeout(() => { tag.textContent = '🎨 自动换肤'; }, 3000);
        }

        function createWheel() {
            const wheel = document.getElementById('wheel');
            wheel.innerHTML = '';
            const angle = 360 / foods.length;

            foods.forEach((food, i) => {
                const seg = document.createElement('div');
                seg.className = 'wheel-segment';
                seg.style.background = colors[i % colors.length];
                seg.style.transform = `rotate(${i * angle - 90}deg) skewY(${-(90 - angle)}deg)`;
                const txt = document.createElement('span');
                txt.textContent = food;
                txt.style.transform = `skewY(${90 - angle}deg) rotate(${angle / 2}deg)`;
                seg.appendChild(txt);
                wheel.appendChild(seg);
            });

            updateFoodListDisplay();
        }

        function updateFoodListDisplay() {
            const d = document.getElementById('foodListDisplay');
            d.innerHTML = foods.map((f, i) =>
                `<div class="food-chip"><span>${f}</span><button class="del-btn" onclick="deleteFood(${i})">×</button></div>`
            ).join('');
        }

        function deleteFood(i) {
            if (foods.length <= 2) { showToast('⚠️ 至少保留2个'); return; }
            const f = foods[i];
            foods.splice(i, 1);
            saveFoods();
            createWheel();
            showToast(`🗑️ ${f}`);
        }

        function spin() {
            if (isSpinning || foods.length === 0) return;
            isSpinning = true;
            const btn = document.getElementById('spinBtn');
            const res = document.getElementById('result');
            btn.disabled = true;
            res.textContent = '🎰 转动中...';
            res.classList.remove('highlight');

            const ri = weightedRandomIndex();
            const angle = 360 / foods.length;
            const target = 360 - (ri * angle + angle / 2);
            const spins = 5 + Math.floor(Math.random() * 3);
            currentRotation += spins * 360 + target;

            document.getElementById('wheel').style.transform = `rotate(${currentRotation}deg)`;

            setTimeout(() => {
                res.textContent = `🎉 今天吃 ${foods[ri]}！`;
                res.classList.add('highlight');
                btn.disabled = false;
                isSpinning = false;
            }, 4000);
        }

        function weightedRandomIndex() {
            const w = foods.map(f => FOOD_WEIGHTS[f] || 1);
            const total = w.reduce((s, v) => s + v, 0);
            let r = Math.random() * total;
            for (let i = 0; i < w.length; i++) {
                r -= w[i];
                if (r <= 0) return i;
            }
            return foods.length - 1;
        }

        function addFood() {
            const inp = document.getElementById('newFoodInput');
            const v = inp.value.trim();
            if (v && !foods.includes(v)) {
                foods.push(v);
                saveFoods();
                createWheel();
                inp.value = '';
                showToast(`✅ ${v}`);
            } else if (foods.includes(v)) {
                showToast('⚠️ 已存在');
            } else {
                showToast('⚠️ 请输入名称');
            }
        }

        function resetFoods() {
            if (confirm('重置为默认列表？')) {
                foods = [...DEFAULT_FOODS];
                saveFoods();
                createWheel();
                showToast('🔄 已重置');
            }
        }

        function exportConfig() {
            const cfg = { version: '3.0', time: new Date().toISOString(), foods, note: '琳蔓の🍳' };
            const blob = new Blob([JSON.stringify(cfg, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `琳蔓美食_${new Date().toISOString().slice(0, 10)}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast('📤 已导出');
        }

        function importConfig(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function (e) {
                try {
                    const cfg = JSON.parse(e.target.result);
                    if (!cfg.foods || !Array.isArray(cfg.foods)) throw new Error('格式错误');
                    if (confirm(`导入 ${cfg.foods.length} 项？`)) {
                        foods = cfg.foods;
                        saveFoods();
                        createWheel();
                        showToast(`📥 ${foods.length} 项已导入`);
                    }
                } catch (err) {
                    showToast('❌ ' + err.message);
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        document.getElementById('newFoodInput').addEventListener('keypress', e => {
            if (e.key === 'Enter') addFood();
        });

        userId = generateUserId();
        loadFoods();
        createFloatingFoods();
        document.body.style.background = backgrounds[0];
        createWheel();

        setInterval(changeBackground, 4 * 60 * 60 * 1000);
        setInterval(createFloatingFoods, 180000);
    </script>
</body>
</html>
