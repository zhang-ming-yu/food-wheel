<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>琳蔓の🍳 - 独立美食转盘</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', '微软雅黑', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            z-index: -2;
            transition: opacity 2s ease-in-out;
        }

        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3);
            z-index: -1;
        }

        .floating-elements {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            overflow: hidden;
        }

        .floating-element {
            position: absolute;
            font-size: 30px;
            opacity: 0.3;
            animation: float 15s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-30px) rotate(180deg); }
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 25px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            max-width: 650px;
            width: 100%;
            position: relative;
            backdrop-filter: blur(10px);
            animation: fadeInUp 0.8s ease-out;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.8em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .user-info {
            display: inline-block;
            background: linear-gradient(135deg, #667eea20 0%, #764ba220 100%);
            padding: 5px 15px;
            border-radius: 15px;
            font-size: 0.85em;
            color: #666;
            margin-bottom: 10px;
            border: 1px solid #667eea30;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .wheel-container {
            position: relative;
            width: 400px;
            height: 400px;
            margin: 30px auto;
        }

        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(102, 126, 234, 0.5), 
                        0 0 0 10px #fff,
                        0 0 0 15px rgba(102, 126, 234, 0.8),
                        0 0 60px rgba(102, 126, 234, 0.3);
            transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99);
        }

        .wheel-segment {
            position: absolute;
            width: 50%;
            height: 50%;
            left: 50%;
            top: 0;
            transform-origin: 0% 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            clip-path: polygon(0% 100%, 100% 0%, 0% 0%);
        }

        .wheel-segment span {
            position: absolute;
            font-size: 14px;
            font-weight: bold;
            color: #fff;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
            transform: rotate(-22.5deg) translateY(-80px);
            white-space: nowrap;
        }

        .pointer {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 40px solid #ff6b6b;
            z-index: 10;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.3));
        }

        .pointer::after {
            content: '';
            position: absolute;
            top: -40px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 20px;
            background: #ff6b6b;
            border-radius: 50%;
        }

        .center-circle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .spin-button {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
            color: white;
            border: none;
            padding: 15px 50px;
            font-size: 1.3em;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(238, 90, 111, 0.4);
            transition: all 0.3s ease;
            font-weight: bold;
            margin-top: 20px;
        }

        .spin-button:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(238, 90, 111, 0.5);
        }

        .spin-button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .result {
            margin-top: 30px;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            color: white;
            font-size: 1.5em;
            font-weight: bold;
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .food-list {
            margin-top: 30px;
            text-align: left;
        }

        .food-list h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.2em;
        }

        .food-items {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .food-item {
            background: linear-gradient(135deg, #f0f0f0 0%, #e0e0e0 100%);
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.9em;
            color: #555;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            cursor: default;
        }

        .food-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .food-item .delete-btn {
            background: #ff6b6b;
            color: white;
            border: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 14px;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            opacity: 0.7;
        }

        .food-item .delete-btn:hover {
            background: #ee5a6f;
            opacity: 1;
            transform: scale(1.1);
        }

        .edit-section {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px dashed #ddd;
        }

        .edit-section h3 {
            color: #333;
            margin-bottom: 15px;
        }

        .edit-input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 1em;
            margin-bottom: 10px;
            transition: border-color 0.3s;
        }

        .edit-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .edit-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .edit-btn {
            padding: 10px 25px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s;
        }

        .add-btn { background: #4CAF50; color: white; }
        .add-btn:hover { background: #45a049; }
        
        .reset-btn { background: #ff9800; color: white; }
        .reset-btn:hover { background: #e68900; }

        .export-btn { background: #2196F3; color: white; }
        .export-btn:hover { background: #1976D2; }

        .import-btn { background: #9C27B0; color: white; }
        .import-btn:hover { background: #7B1FA2; }

        .background-indicator {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.9);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 0.9em;
            color: #666;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            z-index: 1000;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .result.highlight { animation: pulse 0.5s ease-in-out 3; }

        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #333;
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            z-index: 9999;
            animation: slideIn 0.3s ease-out;
            max-width: 300px;
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .hidden-input {
            display: none;
        }

        @media (max-width: 500px) {
            .wheel-container { width: 300px; height: 300px; }
            h1 { font-size: 2em; }
            .wheel-segment span { font-size: 12px; transform: rotate(-22.5deg) translateY(-60px); }
            .center-circle { width: 60px; height: 60px; font-size: 12px; }
            .background-indicator { font-size: 0.8em; padding: 8px 15px; }
            .edit-buttons { flex-direction: column; }
            .edit-btn { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="floating-elements" id="floatingElements"></div>
    
    <div class="container">
        <h1>琳蔓の🍳</h1>
        <div class="user-info" id="userInfo">👤 用户ID：加载中...</div>
        <p class="subtitle">你的专属美食转盘 · 数据独立保存</p>
        
        <div class="wheel-container">
            <div class="pointer"></div>
            <div class="wheel" id="wheel"></div>
            <div class="center-circle">开始</div>
        </div>
        
        <button class="spin-button" id="spinBtn" onclick="spin()">🎲 转动转盘</button>
        
        <div class="result" id="result">点击按钮开始抽取</div>
        
        <div class="food-list">
            <h3>📋 我的食物列表（仅自己可见）</h3>
            <div class="food-items" id="foodListDisplay"></div>
        </div>
        
        <div class="edit-section">
            <h3>✏️ 管理我的菜单</h3>
            <input type="text" class="edit-input" id="newFoodInput" placeholder="输入新的食物名称（可带emoji）...">
            
            <div class="edit-buttons">
                <button class="edit-btn add-btn" onclick="addFood()">➕ 添加</button>
                <button class="edit-btn reset-btn" onclick="resetFoods()">🔄 重置</button>
                <button class="edit-btn export-btn" onclick="exportConfig()">📤 导出配置</button>
                <button class="edit-btn import-btn" onclick="document.getElementById('importInput').click()">📥 导入配置</button>
            </div>
            <input type="file" id="importInput" class="hidden-input" accept=".json" onchange="importConfig(event)">
        </div>

        <div style="margin-top: 20px; padding: 15px; background: #f0f8ff; border-radius: 10px; font-size: 0.9em; color: #555;">
            💡 <strong>提示：</strong><br>
            • 你的数据保存在本浏览器中，其他人看不到<br>
            • 可以导出配置文件分享给朋友<br>
            • 换电脑/清除浏览器数据会丢失，建议定期导出备份
        </div>
    </div>

    <input type="file" id="importInput" class="hidden-input" accept=".json" onchange="importConfig(event)">
    
    <div class="background-indicator" id="bgIndicator">🎨 背景自动切换中...</div>

    <script>
        const DEFAULT_FOODS = [
            '羊肉面🍜', '鸡公煲🍲', '汉堡🍔', '鸡排🍗',
            '寿司🍣', '卤面🍜', '串串🍢', '酸辣粉🌶️',
            '凉皮🥒', '粥🥣', '馄饨🥟', '外婆味道👵',
            '烤鱼🐟', '盖饭🍛', '胡辣汤🌶️'
        ];

        let foods = [];
        let isSpinning = false;
        let currentRotation = 0;
        let currentBgIndex = 0;
        let userId = '';

        const colors = [
            '#FF6B6B', '#4ECDC4', '#45B7D1', '#96CEB4',
            '#FFEAA7', '#DDA0DD', '#98D8C8', '#F7DC6F',
            '#BB8FCE', '#85C1E9', '#F8B500', '#00CED1',
            '#FF69B4', '#32CD32', '#FFD700', '#FF6347'
        ];

        const backgrounds = [
            'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
            'linear-gradient(135deg, #f093fb 0%, #f5576c 100%)',
            'linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)',
            'linear-gradient(135deg, #43e97b 0%, #38f9d7 100%)',
            'linear-gradient(135deg, #fa709a 0%, #fee140 100%)',
            'linear-gradient(135deg, #a8edea 0%, #fed6e3 100%)',
            'linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%)',
            'linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%)',
            'linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%)',
            'linear-gradient(135deg, #d299c2 0%, #fef9d7 100%)',
            'linear-gradient(135deg, #89f7fe 0%, #66a6ff 100%)',
            'linear-gradient(135deg, #cd9cf2 0%, #f6f3ff 100%)'
        ];

        const floatingEmojis = ['🍳', '🍜', '🍲', '🍱', '🍣', '🍕', '🍔', '🌮', '🥗', '🍝', '🥘', '🥙'];

        function generateUserId() {
            let id = localStorage.getItem('wheel_user_id');
            if (!id) {
                id = 'user_' + Math.random().toString(36).substr(2, 9) + '_' + Date.now().toString(36);
                localStorage.setItem('wheel_user_id', id);
            }
            return id;
        }

        function loadFoods() {
            const key = `wheel_foods_${userId}`;
            const saved = localStorage.getItem(key);
            if (saved) {
                try {
                    foods = JSON.parse(saved);
                } catch (e) {
                    foods = [...DEFAULT_FOODS];
                }
            } else {
                foods = [...DEFAULT_FOODS];
            }
        }

        function saveFoods() {
            const key = `wheel_foods_${userId}`;
            localStorage.setItem(key, JSON.stringify(foods));
        }

        function showToast(message, duration = 3000) {
            const existingToast = document.querySelector('.toast');
            if (existingToast) existingToast.remove();
            
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.remove();
            }, duration);
        }

        function createFloatingElements() {
            const container = document.getElementById('floatingElements');
            container.innerHTML = '';
            
            for (let i = 0; i < 15; i++) {
                const element = document.createElement('div');
                element.className = 'floating-element';
                element.textContent = floatingEmojis[Math.floor(Math.random() * floatingEmojis.length)];
                element.style.left = Math.random() * 100 + '%';
                element.style.top = Math.random() * 100 + '%';
                element.style.animationDelay = Math.random() * 15 + 's';
                element.style.animationDuration = (15 + Math.random() * 10) + 's';
                container.appendChild(element);
            }
        }

        function changeBackground() {
            currentBgIndex = (currentBgIndex + 1) % backgrounds.length;
            document.body.style.background = backgrounds[currentBgIndex];
            
            const indicator = document.getElementById('bgIndicator');
            indicator.textContent = `🎨 背景已切换 (${currentBgIndex + 1}/${backgrounds.length})`;
            
            setTimeout(() => {
                indicator.textContent = '🎨 背景自动切换中...';
            }, 3000);
        }

        function createWheel() {
            const wheel = document.getElementById('wheel');
            wheel.innerHTML = '';
            
            const segmentAngle = 360 / foods.length;
            
            foods.forEach((food, index) => {
                const segment = document.createElement('div');
                segment.className = 'wheel-segment';
                segment.style.background = colors[index % colors.length];
                segment.style.transform = `rotate(${index * segmentAngle - 90}deg) skewY(${-(90 - segmentAngle)}deg)`;
                
                const text = document.createElement('span');
                text.textContent = food;
                text.style.transform = `skewY(${90 - segmentAngle}deg) rotate(${segmentAngle / 2}deg)`;
                
                segment.appendChild(text);
                wheel.appendChild(segment);
            });
            
            updateFoodListDisplay();
        }

        function updateFoodListDisplay() {
            const display = document.getElementById('foodListDisplay');
            display.innerHTML = foods.map((food, index) => 
                `<span class="food-item">
                    ${food}
                    <button class="delete-btn" onclick="deleteFood(${index})" title="删除">×</button>
                </span>`
            ).join('');
        }

        function deleteFood(index) {
            if (foods.length <= 2) {
                showToast('⚠️ 至少需要保留2个食物选项！');
                return;
            }
            
            const deletedFood = foods[index];
            foods.splice(index, 1);
            saveFoods();
            createWheel();
            showToast(`🗑️ 已删除：${deletedFood}`);
        }

        function spin() {
            if (isSpinning || foods.length === 0) return;
            
            isSpinning = true;
            const spinBtn = document.getElementById('spinBtn');
            const result = document.getElementById('result');
            
            spinBtn.disabled = true;
            result.textContent = '🎰 转动中...';
            result.classList.remove('highlight');
            
            const randomIndex = Math.floor(Math.random() * foods.length);
            const segmentAngle = 360 / foods.length;
            
            const targetAngle = 360 - (randomIndex * segmentAngle + segmentAngle / 2);
            const spins = 5 + Math.floor(Math.random() * 3);
            const totalRotation = spins * 360 + targetAngle;
            
            currentRotation += totalRotation;
            
            const wheel = document.getElementById('wheel');
            wheel.style.transform = `rotate(${currentRotation}deg)`;
            
            setTimeout(() => {
                result.textContent = `🎉 今天吃：${foods[randomIndex]}！`;
                result.classList.add('highlight');
                spinBtn.disabled = false;
                isSpinning = false;
            }, 4000);
        }

        function addFood() {
            const input = document.getElementById('newFoodInput');
            const newFood = input.value.trim();
            
            if (newFood && !foods.includes(newFood)) {
                foods.push(newFood);
                saveFoods();
                createWheel();
                input.value = '';
                showToast(`✅ 已添加：${newFood}`);
            } else if (foods.includes(newFood)) {
                showToast('⚠️ 这个食物已经在列表中了！');
            } else {
                showToast('⚠️ 请输入食物名称！');
            }
        }

        function resetFoods() {
            if (confirm('确定要重置为默认食物列表吗？\n\n这将只影响你自己的数据。')) {
                foods = [...DEFAULT_FOODS];
                saveFoods();
                createWheel();
                showToast('🔄 已重置为默认列表');
            }
        }

        function exportConfig() {
            const config = {
                version: '1.0',
                exportTime: new Date().toISOString(),
                userId: userId,
                foods: foods,
                note: '琳蔓の🍳 美食转盘配置文件'
            };
            
            const blob = new Blob([JSON.stringify(config, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `琳蔓美食转盘_${userId}_${new Date().toISOString().slice(0,10)}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            showToast('📤 配置已导出！');
        }

        function importConfig(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const config = JSON.parse(e.target.result);
                    
                    if (!config.foods || !Array.isArray(config.foods)) {
                        throw new Error('无效的配置文件格式');
                    }
                    
                    if (confirm(`确定要导入配置吗？\n\n包含 ${config.foods.length} 个食物项\n\n这将替换你当前的食物列表。`)) {
                        foods = config.foods;
                        saveFoods();
                        createWheel();
                        showToast(`📥 成功导入 ${foods.length} 个食物项！`);
                    }
                } catch (error) {
                    showToast('❌ 导入失败：' + error.message);
                }
            };
            reader.readAsText(file);
            
            event.target.value = '';
        }

        document.getElementById('newFoodInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                addFood();
            }
        });

        userId = generateUserId();
        document.getElementById('userInfo').textContent = `👤 用户ID：${userId}`;
        
        loadFoods();
        createFloatingElements();
        document.body.style.background = backgrounds[0];
        createWheel();
        
        setInterval(changeBackground, 4 * 60 * 60 * 1000);
        
        setInterval(() => {
            createFloatingElements();
        }, 60000);

        console.log('%c🍳 琳蔓の美食转盘', 'font-size: 24px; font-weight: bold; color: #667eea;');
        console.log('%c你的用户ID:', 'font-size: 14px; color: #333;', userId);
        console.log('%c数据完全独立存储在你的浏览器中', 'font-size: 12px; color: #666;');
    </script>
</body>
</html>
